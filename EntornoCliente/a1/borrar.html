
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eliminar producto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fef2f2;
      padding: 30px;
    }

    .contenedor {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0002;
    }

    h1 { text-align: center; }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #mensaje {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <h1>Eliminar producto</h1>

    <label>SKU del producto</label>
    <input type="text" id="sku">

    <button onclick="eliminarProducto()">
      Eliminar producto
    </button>

    <p id="mensaje"></p>
  </div>

  <script>
    const API = "https://jsonblob.com/api/jsonBlob/01a13a94-f6c1-79aa-9a24-52e43d8318c9";

    async function eliminarProducto() {
      const sku = document.getElementById("sku").value.trim();
      const mensaje = document.getElementById("mensaje");

      try {
        if (!sku) {
          throw new Error("Introduce un SKU");
        }

        // 1. Obtener JSON completo
        const respuesta = await fetch(API);

        if (!respuesta.ok) {
          throw new Error("Error GET: " + respuesta.status);
        }

        const datos = await respuesta.json();

        // 2. Buscar producto
        const producto = datos.products.find(
          p => p.SKU === sku
        );

        if (!producto) {
          mensaje.textContent = "Producto no encontrado";
          return;
        }

        // 3. Pedir confirmación
        const confirmar = confirm(
          "¿Seguro que quieres eliminar " + producto.title + "?"
        );

        if (!confirmar) {
          return;
        }

        // 4. Eliminar del array
        datos.products = datos.products.filter(
          p => p.SKU !== sku
        );

        // 5. Guardar JSON modificado
        const guardar = await fetch(API, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(datos)
        });

        if (!guardar.ok) {
          throw new Error("Error PUT: " + guardar.status);
        }

        mensaje.textContent = "Producto eliminado correctamente";
        document.getElementById("sku").value = "";

      } catch (error) {
        mensaje.textContent = "Error: " + error.message;
        console.error(error);
      }
    }
  </script>

</body>
</html>
