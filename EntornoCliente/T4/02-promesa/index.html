<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <title>E02 · Una promesa, dos desenlaces</title>
        <link rel="stylesheet" href="styles.css">
        <script src="app.js" defer></script>
    </head>
    <body>
        <main>
            <h1>Una promesa, dos desenlaces</h1>
            <p class="lead">Una promesa comienza pendiente y solo puede quedar cumplida o rechazada.</p>
            <div class="controls">
                <label>Desenlace 
                    <select id="mode">
                        <option value="ok">Pedido disponible</option>
                        <option value="error">Pedido agotado</option>
                    </select>
                </label>
                <button id="run">Preparar pedido</button>
            </div>
            <p id="status" class="status" role="status">Sin iniciar</p>
            <progress id="progress" value="0" max="1" aria-label="Estado del pedido">

            </progress>
            <pre id="log" aria-live="polite"></pre>
        </main>
    </body>
</html>
