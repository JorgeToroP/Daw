# =====================================================================
#  Apache como proxy inverso hacia Tomcat
#  1. Copiar este fichero a  C:\xampp\apache\conf\extra\httpd-biblioteca.conf
#  2. Anadir al FINAL de     C:\xampp\apache\conf\httpd.conf  la linea:
#        Include conf/extra/httpd-biblioteca.conf
#  3. Reiniciar Apache desde el panel de XAMPP
# =====================================================================

# Modulos necesarios (solo se cargan si no estaban ya cargados)
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

# Apache NO actua como proxy abierto, solo reenvia las rutas indicadas
ProxyRequests Off

# Todo lo que llegue a http://localhost/biblioteca-api/...
# se reenvia a Tomcat:  http://127.0.0.1:8080/biblioteca/api/...
ProxyPass        "/biblioteca-api/" "http://127.0.0.1:8080/biblioteca/api/"
ProxyPassReverse "/biblioteca-api/" "http://127.0.0.1:8080/biblioteca/api/"

# Alternativa con AJP (el conector que XAMPP trae preconfigurado en httpd-ajp.conf).
# Requiere tener activo el conector AJP en C:\xampp\tomcat\conf\server.xml
# (puerto 8009; desde Tomcat 8.5.51 exige secret o secretRequired="false").
# ProxyPass        "/biblioteca-api/" "ajp://127.0.0.1:8009/biblioteca/api/"
# ProxyPassReverse "/biblioteca-api/" "ajp://127.0.0.1:8009/biblioteca/api/"
